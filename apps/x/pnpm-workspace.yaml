packages:
  - apps/*
  - packages/*

allowBuilds:
  baileys: true
  core-js: true
  electron: true
  electron-winstaller: true
  esbuild: true
  fs-xattr: true
  macos-alias: true
  node-pty: true
  protobufjs: true
  uiohook-napi: true

blockExoticSubdeps: false

overrides:
  vscode-jsonrpc: 8.2.0

# langium imports vscode-jsonrpc/lib/common/events.js but doesn't declare the
# dependency (it only gets it transitively via vscode-languageserver), which
# breaks resolution under pnpm's strict layout. Graft it on.
packageExtensions:
  langium:
    dependencies:
      vscode-jsonrpc: '*'

catalog:
  vitest: 4.1.7

onlyBuiltDependencies:
  - baileys
  - core-js
  - electron
  - electron-winstaller
  - esbuild
  - fs-xattr
  - macos-alias
  - protobufjs

minimumReleaseAgeExclude:
  - '@agentclientprotocol/claude-agent-acp@0.67.0'
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.232'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.232'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.232'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.232'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.232'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.232'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.232'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.232'
  - '@anthropic-ai/claude-agent-sdk@0.3.232'
