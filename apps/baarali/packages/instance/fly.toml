# The owner's instance on Fly, Paris (architecture §6, decided 30/09/2026):
# suspended when idle, woken by the next request. Suspend needs 2 GB or
# less. No public IP: reached over Flycast (private), by `fly proxy` from
# the desktop in phase 0, by the control plane later.
# Secret (fly secrets): BAARALI_INSTANCE_TOKEN.
app = "warell-owner"
primary_region = "cdg"

[env]
  API_URL = "https://app.baarali.com"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = false
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"
