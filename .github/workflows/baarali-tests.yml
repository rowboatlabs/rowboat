name: baarali-tests

# Baarali's own CI, separate from the upstream x-tests.yml so upstream syncs
# never conflict on it (UPSTREAM.md §2, 30/09/2026).
on:
  pull_request:
    paths:
      - 'apps/baarali/**'
      - 'apps/x/packages/shared/**'
      - '.github/workflows/baarali-tests.yml'
  push:
    branches: [main]
    paths:
      - 'apps/baarali/**'
      - 'apps/x/packages/shared/**'
      - '.github/workflows/baarali-tests.yml'
  workflow_dispatch:

jobs:
  apps-baarali:
    name: apps/baarali typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            apps/harbor/pnpm-lock.yaml
            apps/x/pnpm-lock.yaml
            apps/baarali/pnpm-lock.yaml

      # @x/shared links @rowboat/spaces-protocol from harbor, and we link
      # @x/shared: build the chain in order, as x-tests.yml does.
      - name: Build apps/harbor (link deps)
        run: pnpm install --frozen-lockfile && pnpm -r build
        working-directory: apps/harbor

      - name: Install apps/x
        run: pnpm install --frozen-lockfile
        working-directory: apps/x

      - name: Build @x/shared
        run: npm run build
        working-directory: apps/x/packages/shared

      - name: Install apps/baarali
        run: pnpm install --frozen-lockfile
        working-directory: apps/baarali

      - name: Typecheck
        run: pnpm typecheck
        working-directory: apps/baarali

      - name: Test
        run: pnpm test
        working-directory: apps/baarali

      - name: Build
        run: pnpm build
        working-directory: apps/baarali
