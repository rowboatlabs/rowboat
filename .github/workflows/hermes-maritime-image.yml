# Builds and publishes the Hermes-for-Maritime image (apps/harbor/images/hermes-maritime):
# ghcr.io/rowboatlabs/hermes-maritime:<VERSION>, where VERSION is the file beside the
# Dockerfile. Pushes from this repository's own branches as well as from main, so a
# pull request's image can be tried on Maritime before it merges; a fork's pull request
# only builds. The package must be public on GHCR for Maritime to pull it.
name: hermes-maritime image

on:
  pull_request:
    paths:
      - apps/harbor/images/hermes-maritime/**
      - .github/workflows/hermes-maritime-image.yml
  push:
    branches: [main]
    paths:
      - apps/harbor/images/hermes-maritime/**
      - .github/workflows/hermes-maritime-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: shim unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest -v test_shim
        working-directory: apps/harbor/images/hermes-maritime

  image:
    name: build and push
    needs: test
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/rowboatlabs/hermes-maritime
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: version
        run: echo "tag=$(tr -d '[:space:]' < apps/harbor/images/hermes-maritime/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Decide whether to push
        id: push
        # Pushing needs this repository's token; a fork's pull request has a read-only one.
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: steps.push.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: apps/harbor/images/hermes-maritime
          platforms: linux/amd64
          push: ${{ steps.push.outputs.push == 'true' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
